<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>logGO</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #3f3f46;
        --text-h: #08060d;
        --bg: #fff;
        --bg-alt: #f7f7f8;
        --border: #e5e4e7;
        --accent: #7c3aed;
        --accent-bg: rgba(124, 58, 237, 0.1);
        --danger: #b3261e;
        --danger-bg: rgba(179, 38, 30, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #b4b8c2;
          --text-h: #f3f4f6;
          --bg: #16171d;
          --bg-alt: #1c1d24;
          --border: #2e303a;
          --accent: #c084fc;
          --accent-bg: rgba(192, 132, 252, 0.15);
          --danger: #ff8a80;
          --danger-bg: rgba(255, 138, 128, 0.12);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }
      h1 { font-size: 18px; color: var(--text-h); margin: 0; }
      .layout { display: flex; align-items: flex-start; }
      aside.sidebar {
        width: 220px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        padding: 16px 12px;
        height: calc(100vh - 49px);
        overflow-y: auto;
      }
      main { flex: 1; padding: 20px; min-width: 0; }
      .sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text);
        font-weight: 500;
        margin: 0 0 8px;
      }
      .source-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      .source-item:hover { background: var(--bg-alt); }
      .source-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
      .source-item .remove {
        opacity: 0;
        border: none;
        background: none;
        color: var(--danger);
        cursor: pointer;
        font-size: 14px;
        padding: 0 4px;
      }
      .source-item:hover .remove { opacity: 1; }
      .add-service-btn {
        width: 100%;
        margin-top: 8px;
        font: inherit;
        border: 1px dashed var(--border);
        background: none;
        color: var(--text);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .add-service-btn:hover { border-color: var(--accent); color: var(--accent); }
      .add-service-form {
        margin-top: 8px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-alt);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .kind-toggle { display: flex; gap: 4px; margin-bottom: 2px; }
      .kind-toggle button {
        flex: 1;
        font-size: 13px;
        padding: 4px 6px;
        background: var(--bg);
      }
      .kind-toggle button.active { background: var(--accent); border-color: var(--accent); color: white; }
      .field-hint { font-size: 12px; color: var(--text); margin: 0; }
      .push-instructions {
        margin-top: 8px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-alt);
      }
      .push-instructions pre {
        margin: 6px 0 0;
        padding: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow-x: auto;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .protocol-badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        margin-left: 6px;
        border: 1px solid var(--border);
        color: var(--text);
      }
      select, input, button {
        font: inherit;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        border-radius: 6px;
        padding: 6px 10px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
      th { font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      .mono { font-family: ui-monospace, monospace; font-size: 12px; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        color: white;
        background: var(--accent);
      }
      .level-DEBUG { color: var(--text); }
      .level-INFO { color: #2e9e5b; }
      .level-WARN { color: #c77d16; }
      .level-ERROR { color: var(--danger); }
      .empty { text-align: center; color: var(--text); padding: 24px 0; }
      .status { font-size: 13px; color: var(--text); }
      .conn-open { color: #2e9e5b; }
      .conn-connecting { color: #c77d16; }
      .conn-closed { color: var(--danger); }
      .error-text { color: var(--danger); font-size: 13px; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>logGO</h1>
      <span class="status" id="conn-status">connecting…</span>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <h2>Sources</h2>
        <div id="source-list"></div>
        <button class="add-service-btn" id="add-service-toggle">+ Add service</button>
        <form class="add-service-form" id="add-service-form" style="display: none">
          <div class="kind-toggle">
            <button type="button" class="active" data-kind="push" id="kind-push">Push</button>
            <button type="button" data-kind="pull" id="kind-pull">Pull</button>
          </div>

          <input id="new-name" placeholder="Name (e.g. checkout-service)" required />

          <div id="push-fields">
            <p class="field-hint">How will this service send its logs to logGO?</p>
            <select id="new-protocol">
              <option value="rest">REST (POST /ingest)</option>
              <option value="websocket">WebSocket (persistent connection)</option>
              <option value="grpc">gRPC (IngestService)</option>
            </select>
          </div>

          <div id="pull-fields" style="display: none">
            <input id="new-url" placeholder="Base URL (e.g. http://host:8080)" />
            <input id="new-key" placeholder="API key" />
          </div>

          <button type="submit">Add</button>
          <p class="error-text" id="add-service-error" style="display: none"></p>
        </form>
        <div class="push-instructions" id="push-instructions" style="display: none"></div>
      </aside>
      <main>
        <p class="status">
          <span id="scope-label">All sources</span> — logGO's own entries plus
          anything ingested live (see the <code>source</code> column).
        </p>
        <div class="toolbar">
          <select id="level">
            <option value="DEBUG">DEBUG+</option>
            <option value="INFO" selected>INFO+</option>
            <option value="WARN">WARN+</option>
            <option value="ERROR">ERROR+</option>
          </select>
          <input id="contains" placeholder="message contains…" />
        </div>
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Level</th>
              <th>Source</th>
              <th>Message</th>
              <th>Fields</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="empty" style="display: none">No entries match.</p>
      </main>
    </div>
    <script>
      const rowsEl = document.getElementById('rows')
      const emptyEl = document.getElementById('empty')
      const connStatusEl = document.getElementById('conn-status')
      const scopeLabelEl = document.getElementById('scope-label')
      const levelEl = document.getElementById('level')
      const containsEl = document.getElementById('contains')
      const sourceListEl = document.getElementById('source-list')
      const addServiceToggle = document.getElementById('add-service-toggle')
      const addServiceForm = document.getElementById('add-service-form')
      const addServiceError = document.getElementById('add-service-error')

      let sources = []
      let selectedSourceID = '' // '' = all sources
      let socket = null
      let entries = []

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]))
      }

      function nameForSource(id) {
        const s = sources.find((s) => s.id === id)
        return s ? s.name : id
      }

      function render() {
        rowsEl.innerHTML = ''
        emptyEl.style.display = entries.length === 0 ? 'block' : 'none'
        for (const e of entries.slice().reverse()) {
          const tr = document.createElement('tr')
          const fields = { ...(e.fields || {}) }
          const sourceID = fields.source
          const sourceLabel = sourceID ? nameForSource(sourceID) : '(logGO itself)'
          delete fields.source
          tr.innerHTML =
            '<td class="mono">' + new Date(e.timestamp).toLocaleTimeString() + '</td>' +
            '<td class="level-' + e.level + '">' + e.level + '</td>' +
            '<td><span class="badge">' + escapeHtml(sourceLabel) + '</span></td>' +
            '<td>' + escapeHtml(e.message) + '</td>' +
            '<td class="mono">' + escapeHtml(Object.keys(fields).length ? JSON.stringify(fields) : '') + '</td>'
          rowsEl.appendChild(tr)
        }
      }

      function renderSourceList() {
        sourceListEl.innerHTML = ''
        const allItem = document.createElement('div')
        allItem.className = 'source-item' + (selectedSourceID === '' ? ' active' : '')
        allItem.innerHTML = '<span>All sources</span>'
        allItem.onclick = () => selectSource('')
        sourceListEl.appendChild(allItem)

        for (const s of sources) {
          const item = document.createElement('div')
          item.className = 'source-item' + (selectedSourceID === s.id ? ' active' : '')
          const badge = s.kind === 'push' && s.protocol
            ? '<span class="protocol-badge">' + escapeHtml(s.protocol) + '</span>'
            : ''
          item.innerHTML = '<span>' + escapeHtml(s.name) + badge + '</span><button class="remove" title="Remove">×</button>'
          item.querySelector('span').onclick = () => selectSource(s.id)
          item.querySelector('.remove').onclick = (ev) => {
            ev.stopPropagation()
            removeSource(s.id)
          }
          sourceListEl.appendChild(item)
        }
      }

      function selectSource(id) {
        selectedSourceID = id
        scopeLabelEl.textContent = id ? nameForSource(id) : 'All sources'
        renderSourceList()
        connect()
      }

      async function loadSources() {
        const res = await fetch('/sources')
        sources = (await res.json()) || []
        renderSourceList()
      }

      async function removeSource(id) {
        if (!confirm('Stop ingesting from "' + nameForSource(id) + '"? Its history stays, only new entries stop.')) return
        await fetch('/sources/' + encodeURIComponent(id), { method: 'DELETE' })
        if (selectedSourceID === id) selectedSourceID = ''
        await loadSources()
        connect()
      }

      const pushFieldsEl = document.getElementById('push-fields')
      const pullFieldsEl = document.getElementById('pull-fields')
      const pushInstructionsEl = document.getElementById('push-instructions')
      let selectedKind = 'push'

      function setKind(kind) {
        selectedKind = kind
        document.getElementById('kind-push').classList.toggle('active', kind === 'push')
        document.getElementById('kind-pull').classList.toggle('active', kind === 'pull')
        pushFieldsEl.style.display = kind === 'push' ? 'block' : 'none'
        pullFieldsEl.style.display = kind === 'pull' ? 'block' : 'none'
        document.getElementById('new-url').required = kind === 'pull'
        document.getElementById('new-key').required = kind === 'pull'
      }
      document.getElementById('kind-push').addEventListener('click', () => setKind('push'))
      document.getElementById('kind-pull').addEventListener('click', () => setKind('pull'))

      // Snippets shown after registering a push source — the actual
      // wire format each protocol expects (see cmd/server/ingest_handlers.go
      // and cmd/demo-*-client for working examples of each).
      function pushSnippet(protocol, id) {
        const body = JSON.stringify({ source: id, level: 'INFO', message: 'hello' })
        if (protocol === 'rest') {
          return "curl -X POST http://" + location.host + "/ingest \\\n" +
            "  -H 'Content-Type: application/json' -d '" + body + "'"
        }
        if (protocol === 'websocket') {
          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
          return "wscat -c " + proto + "//" + location.host + "/ws/ingest\n> " + body
        }
        return "grpcurl -plaintext -d '" + JSON.stringify({ source: id, entry: { level: 'INFO', message: 'hello' } }) +
          "' \\\n  " + location.host + " ingest.v1.IngestService/Ingest"
      }

      addServiceToggle.addEventListener('click', () => {
        addServiceForm.style.display = addServiceForm.style.display === 'none' ? 'flex' : 'none'
        pushInstructionsEl.style.display = 'none'
      })

      addServiceForm.addEventListener('submit', async (ev) => {
        ev.preventDefault()
        addServiceError.style.display = 'none'
        const name = document.getElementById('new-name').value.trim()
        const body = selectedKind === 'push'
          ? { name, kind: 'push', protocol: document.getElementById('new-protocol').value }
          : {
              name,
              kind: 'pull',
              base_url: document.getElementById('new-url').value.trim(),
              api_key: document.getElementById('new-key').value.trim(),
            }
        try {
          const res = await fetch('/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          if (!res.ok) throw new Error(await res.text())
          const added = await res.json()
          document.getElementById('new-name').value = ''
          document.getElementById('new-url').value = ''
          document.getElementById('new-key').value = ''
          addServiceForm.style.display = 'none'
          await loadSources()

          if (selectedKind === 'push') {
            pushInstructionsEl.innerHTML =
              '<p class="field-hint">"' + escapeHtml(added.name) + '" registered — point it at logGO with:</p>' +
              '<pre>' + escapeHtml(pushSnippet(added.protocol, added.id)) + '</pre>'
            pushInstructionsEl.style.display = 'block'
          }
        } catch (err) {
          addServiceError.textContent = err.message
          addServiceError.style.display = 'block'
        }
      })

      // Real-time push over WebSocket — reconnects whenever the
      // selected source or filters change, since those are all query
      // params on the connection itself, not something you can update
      // on an already-open socket.
      function connect() {
        if (socket) socket.close()
        entries = []
        render()
        connStatusEl.textContent = 'connecting…'
        connStatusEl.className = 'status conn-connecting'

        const params = new URLSearchParams({ level: levelEl.value })
        if (containsEl.value) params.set('contains', containsEl.value)
        if (selectedSourceID) params.set('source_id', selectedSourceID)
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
        socket = new WebSocket(proto + '//' + location.host + '/ws/entries?' + params.toString())

        socket.onopen = () => {
          connStatusEl.textContent = 'live'
          connStatusEl.className = 'status conn-open'
        }
        socket.onmessage = (event) => {
          entries.push(JSON.parse(event.data))
          if (entries.length > 500) entries.shift()
          render()
        }
        socket.onclose = () => {
          connStatusEl.textContent = 'disconnected — retrying…'
          connStatusEl.className = 'status conn-closed'
          setTimeout(() => { if (socket && socket.readyState === WebSocket.CLOSED) connect() }, 2000)
        }
      }

      levelEl.addEventListener('change', connect)
      containsEl.addEventListener('change', connect)

      loadSources().then(connect)
    </script>
  </body>
</html>
